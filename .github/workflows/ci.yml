name: CI

on:
  push:
    branches: [ main, develop, release/** ]
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '17'
  GO_VERSION: '1.22'
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  # ============================================================
  # Java 后端编译 + 测试 (storage / evaluator-api)
  # ============================================================
  java-build:
    name: Java Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: iaoep_evaluator
          POSTGRES_USER: iaoep
          POSTGRES_PASSWORD: iaoep_dev_pwd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      clickhouse:
        image: clickhouse/clickhouse-server:24.3
        ports:
          - 8123:8123
        options: >-
          --health-cmd wget --spider -q http://localhost:8123/ping
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build storage
        run: mvn -pl storage -am clean verify -DskipTests=false

      - name: Build evaluator-api
        run: mvn -pl evaluator/api -am clean verify -DskipTests=false

  # ============================================================
  # Go 服务编译 + 测试 (ingest)
  # ============================================================
  go-build:
    name: Go Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build ingest
        working-directory: ingest
        run: go build -v ./...
      - name: Test ingest
        working-directory: ingest
        run: go test -v -race -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ingest/coverage.out

  # ============================================================
  # Web 前端 lint + build
  # ============================================================
  web-build:
    name: Web Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: web
        run: pnpm type-check

      - name: Build
        working-directory: web
        run: pnpm build

  # ============================================================
  # Python 服务 (evaluator/python sidecar)
  # ============================================================
  python-build:
    name: Python Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        working-directory: evaluator/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: evaluator/python
        run: pytest -v --cov=iaoep_sdk --cov=app

  # ============================================================
  # Docker 镜像构建 (PR merge 到 main 时)
  # ============================================================
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [java-build, go-build, web-build, python-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: ingest
            dockerfile: ingest/Dockerfile
            context: ingest
          - service: storage
            dockerfile: storage/Dockerfile
            context: storage
          - service: evaluator-api
            dockerfile: evaluator/api/Dockerfile
            context: evaluator/api
          - service: evaluator-judge
            dockerfile: evaluator/python/Dockerfile
            context: evaluator/python
          - service: web
            dockerfile: web/Dockerfile
            context: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/iaoep-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/iaoep-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
