{{- if .Values.web.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "iaoep.fullname" . }}-web
  labels:
    {{- include "iaoep.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
  selector:
    {{- include "iaoep.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
{{- end }}
