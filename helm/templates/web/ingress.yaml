{{- if and .Values.web.enabled .Values.web.ingress.enabled }}
{{- $fullName := include "iaoep.fullname" . -}}
{{- $svcPort := .Values.web.service.port -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-web
  labels:
    {{- include "iaoep.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.web.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.web.ingress.className }}
  rules:
    {{- range .Values.web.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $fullName }}-web
                port:
                  number: {{ $svcPort }}
          {{- end }}
    {{- end }}
{{- end }}
