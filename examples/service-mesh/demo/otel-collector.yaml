# OpenTelemetry Collector — Phase 6 A/B Test demo
#
# 收集 Agent + Istio sidecar 的 OTLP trace, 送到 IAOEP Ingest Gateway.

apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-conf
  namespace: default
  labels:
    app: otel-collector
    app.kubernetes.io/part-of: iaoep
data:
  relay: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 5s
        send_batch_size: 1000
      # 添加 A/B Test tag (从 header 透传)
      attributes/iaoep:
        actions:
          - key: ab_test_name
            from_attribute: x-iaoep-ab-test-name
            action: insert
          - key: ab_test_group
            from_attribute: x-iaoep-ab-test-group
            action: insert

    exporters:
      otlp/iaoep:
        endpoint: iaoep-ingest:4318
        tls:
          insecure: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch, attributes/iaoep]
          exporters: [otlp/iaoep]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: default
  labels:
    app: otel-collector
    app.kubernetes.io/part-of: iaoep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
        app.kubernetes.io/part-of: iaoep
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.100.0
          ports:
            - containerPort: 4317
            - containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: otel-collector-conf
            items:
              - key: relay
                path: otel-collector.yaml

---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: default
  labels:
    app: otel-collector
spec:
  ports:
    - name: otlp-grpc
      port: 4317
    - name: otlp-http
      port: 4318
  selector:
    app: otel-collector
