[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iaoep-judge"
version = "0.2.0"
description = "IAOEP LLM-as-Judge sidecar — FastAPI 服务调用 LLM 对 trace 评分"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "IAOEP Contributors"}]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.55.0",          # OpenAI 兼容协议 (千问 / GLM / DeepSeek 都支持)
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["app"]
