# IAOEP 数据层最小启动 (Phase 1 PR 1)
# 只启动 ClickHouse + Kafka + Zookeeper,服务代码待后续 PR 加入

services:

  # ============================================================
  # ClickHouse — Trace / Metrics 主存储
  # ============================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: iaoep-clickhouse
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # Native
    environment:
      CLICKHOUSE_DB: iaoep
      CLICKHOUSE_USER: iaoep
      CLICKHOUSE_PASSWORD: iaoep_dev_pwd
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./docker-compose/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================================================
  # Zookeeper — Kafka 依赖
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: iaoep-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================================================
  # Kafka — 消息队列 (traces / metrics 流)
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: iaoep-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"   # Internal
      - "29092:29092" # External (for host clients)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 12
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ============================================================
  # Prometheus — Metrics 存储 (Phase 1 PR 3 加入)
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: iaoep-prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./docker-compose/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"

  # ============================================================
  # Grafana — 临时可视化 (Phase 1 PR 5 用 Web Dashboard 替换)
  # ============================================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: iaoep-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - clickhouse

volumes:
  clickhouse-data:
  prometheus-data:
  grafana-data:

# ============================================================
# 启动后访问:
#   ClickHouse HTTP:  http://localhost:8123  (iaoep / iaoep_dev_pwd)
#   Kafka External:  localhost:29092
#   Prometheus:       http://localhost:9090
#   Grafana:          http://localhost:3000  (admin / admin)
# ============================================================
